<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sales Report</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fc;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h1{
    color:#0f172a;
}

.back-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h2{
    color:#2563eb;
    margin-bottom:10px;
}

.table-box{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2563eb;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #eee;
    text-align:center;
}

.print-btn{
    background:#10b981;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="header">
    <h1>📊 Sales Report</h1>

    <button class="back-btn"
    onclick="window.location.href='/page/shop-dashboard.html'">
        ⬅ Back
    </button>
</div>

<div class="cards">

    <div class="card">
        <h2>₹2,50,000</h2>
        <p>Total Sales</p>
    </div>

    <div class="card">
        <h2>150</h2>
        <p>Total Orders</p>
    </div>

    <div class="card">
        <h2>85</h2>
        <p>Total Customers</p>
    </div>

    <div class="card">
        <h2>₹1,80,000</h2>
        <p>Monthly Revenue</p>
    </div>

</div>

<div class="table-box">

<table>

<tr>
    <th>Date</th>
    <th>Orders</th>
    <th>Revenue</th>
    <th>Print</th>
</tr>

<tr>
    <td>01-06-2026</td>
    <td>25</td>
    <td>₹35,000</td>
    <td>
        <button class="print-btn"
        onclick="printReport('01-06-2026','25','35000')">
            Print
        </button>
    </td>
</tr>

<tr>
    <td>10-06-2026</td>
    <td>30</td>
    <td>₹42,000</td>
    <td>
        <button class="print-btn"
        onclick="printReport('10-06-2026','30','42000')">
            Print
        </button>
    </td>
</tr>

<tr>
    <td>20-06-2026</td>
    <td>40</td>
    <td>₹58,000</td>
    <td>
        <button class="print-btn"
        onclick="printReport('20-06-2026','40','58000')">
            Print
        </button>
    </td>
</tr>

</table>

</div>

<script>

function printReport(date,orders,revenue){

let w = window.open("");

w.document.write(`
<h2>Sales Report</h2>
<hr>
<p><b>Date:</b> ${date}</p>
<p><b>Total Orders:</b> ${orders}</p>
<p><b>Total Revenue:</b> ₹${revenue}</p>
`);

w.print();

}

</script>

</body>
</html>

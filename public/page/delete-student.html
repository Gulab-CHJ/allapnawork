<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Student</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fc;
    padding:30px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    color:#0f172a;
}

/* Search Box */
.search-box{
    max-width:700px;
    margin:0 auto 30px;
}

.search-box input{
    width:100%;
    padding:16px 25px;
    border:none;
    border-radius:50px;
    font-size:16px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    outline:none;
}

/* Student List */
.student-list{
    max-width:900px;
    margin:auto;
}

.student-card{
    background:#fff;
    padding:18px 20px;
    margin-bottom:15px;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.student-info h3{
    color:#0f172a;
}

.student-info p{
    color:#666;
    font-size:14px;
}

.delete-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.delete-btn:hover{
    background:#dc2626;
}
</style>
</head>
<body>

<div class="header">
    <h1>🗑 Delete Student</h1>
</div>

<div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="Search student like Google..."
        onkeyup="searchStudent()">
</div>

<div class="student-list" id="studentList">

    <div class="student-card">
        <div class="student-info">
            <h3>Rahul Kumar</h3>
            <p>Class 10 | Phone: 9876543210</p>
        </div>

        <button class="delete-btn"
        onclick="deleteStudent(this)">
            Delete
        </button>
    </div>

    <div class="student-card">
        <div class="student-info">
            <h3>Priya Singh</h3>
            <p>Class 9 | Phone: 9876543211</p>
        </div>

        <button class="delete-btn"
        onclick="deleteStudent(this)">
            Delete
        </button>
    </div>

    <div class="student-card">
        <div class="student-info">
            <h3>Amit Verma</h3>
            <p>Class 12 | Phone: 9876543212</p>
        </div>

        <button class="delete-btn"
        onclick="deleteStudent(this)">
            Delete
        </button>
    </div>

</div>

<script>

function searchStudent() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.querySelectorAll(".student-card");

    cards.forEach(card => {
        let name = card.querySelector("h3").innerText.toLowerCase();

        if(name.includes(input)){
            card.style.display = "flex";
        }else{
            card.style.display = "none";
        }
    });
}

function deleteStudent(btn){

    if(confirm("Delete this student?")){
        btn.parentElement.remove();
    }

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Premium Product Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f7fb;
}

/* Header */

.header{
    background:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:24px;
    font-weight:700;
    color:#2563eb;
}

.search-box{
    width:45%;
}

.search-box input{
    width:100%;
    padding:12px 20px;
    border:none;
    border-radius:50px;
    background:#eef2ff;
    outline:none;
}

.cart-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
}

/* Products */

.container{
    padding:30px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:25px;
}

/* Card */

.product-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.3s;
    
}

.product-card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 35px rgba(37,99,235,.15);
}

.badge{
    position:absolute;
    top:10px;
    left:10px;
    background:#ef4444;
    color:white;
    font-size:11px;
    padding:4px 10px;
    border-radius:20px;
    z-index:10;
}

.product-image{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.product-title{
    font-size:15px;
    font-weight:600;
    color:#111827;
    margin-bottom:8px;
}

.rating{
    display:inline-block;
    background:#10b981;
    color:white;
    font-size:12px;
    padding:4px 8px;
    border-radius:6px;
    margin-bottom:10px;
}

.price{
    font-size:22px;
    font-weight:700;
    color:#111827;
}

.old-price{
    font-size:13px;
    color:#94a3b8;
    text-decoration:line-through;
    margin-left:5px;
}

.discount{
    color:#10b981;
    font-size:13px;
    margin-left:5px;
}

.btn-group{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.add-cart{
    width:50px;
    border:none;
    border-radius:10px;
    background:#f59e0b;
    color:white;
    cursor:pointer;
    font-size:18px;
}

.buy-now{
    flex:1;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    padding:12px;
    cursor:pointer;
    font-weight:600;
}

/* Mobile */

@media(max-width:768px){

.header{
    flex-direction:column;
    gap:15px;
}

.search-box{
    width:100%;
}

.container{
    padding:15px;
}

}

</style>
</head>
<body>

<!-- Header -->

<div class="header">

    <div class="logo">
        🛍 My Shop
    </div>

    <div class="search-box">
        <input type="text" placeholder="Search products...">
    </div>

    <button class="cart-btn">
        🛒 Cart
    </button>

</div>

<!-- Products -->

<div class="container">

    <div class="products-grid">

        <!-- Product 1 -->

        <div class="product-card">

            <span class="badge">🔥 Bestseller</span>

            <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=600"
            class="product-image">

            <div class="product-info">

                <div class="product-title">
                    Hair Growth Oil
                </div>

                <div class="rating">
                    ⭐ 4.8
                </div>

                <div class="price">
                    ₹299
                    <span class="old-price">₹599</span>
                    <span class="discount">50% OFF</span>
                </div>

                <div class="btn-group">

                    <button class="add-cart">
                        🛒
                    </button>

                    <button class="buy-now">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <!-- Product 2 -->

        <div class="product-card">

            <span class="badge">⭐ Premium</span>

            <img src="https://images.unsplash.com/photo-1571781926291-c477ebfd024b?w=600"
            class="product-image">

            <div class="product-info">

                <div class="product-title">
                    Herbal Shampoo
                </div>

                <div class="rating">
                    ⭐ 4.6
                </div>

                <div class="price">
                    ₹399
                    <span class="old-price">₹699</span>
                    <span class="discount">43% OFF</span>
                </div>

                <div class="btn-group">

                    <button class="add-cart">
                        🛒
                    </button>

                    <button class="buy-now">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <!-- Product 3 -->

        <div class="product-card">

            <span class="badge">🚀 New</span>

            <img src="https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd?w=600"
            class="product-image">

            <div class="product-info">

                <div class="product-title">
                    Vitamin Capsules
                </div>

                <div class="rating">
                    ⭐ 4.9
                </div>

                <div class="price">
                    ₹499
                    <span class="old-price">₹899</span>
                    <span class="discount">45% OFF</span>
                </div>

                <div class="btn-group">

                    <button class="add-cart">
                        🛒
                    </button>

                    <button class="buy-now">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <!-- Product 4 -->

        <div class="product-card">

            <span class="badge">💎 Top Rated</span>

            <img src="https://images.unsplash.com/photo-1607619056574-7b8d3ee536b2?w=600"
            class="product-image">

            <div class="product-info">

                <div class="product-title">
                    Skin Care Cream
                </div>

                <div class="rating">
                    ⭐ 5.0
                </div>

                <div class="price">
                    ₹799
                    <span class="old-price">₹1299</span>
                    <span class="discount">38% OFF</span>
                </div>

                <div class="btn-group">

                    <button class="add-cart">
                        🛒
                    </button>

                    <button class="buy-now">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orders Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fc;
}

.header{
    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:#fff;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.back-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.container{
    padding:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
    color:#2563eb;
    margin-bottom:10px;
}

.search-box{
    margin-bottom:25px;
}

.search-box input{
    width:100%;
    padding:15px 20px;
    border:none;
    border-radius:50px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    outline:none;
}

.table-box{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2563eb;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #eee;
}

.status{
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:13px;
}

.pending{
    background:#f59e0b;
}

.completed{
    background:#10b981;
}

.view-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
}

.print-btn{
    background:#10b981;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="header">
    <h1>🛒 Orders Management</h1>

    <button class="back-btn"
    onclick="window.location.href='/page/shop-dashboard.html'">
        ⬅ Back
    </button>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <h2>120</h2>
            <p>Total Orders</p>
        </div>

        <div class="card">
            <h2>25</h2>
            <p>Pending Orders</p>
        </div>

        <div class="card">
            <h2>95</h2>
            <p>Completed Orders</p>
        </div>

        <div class="card">
            <h2>₹85,000</h2>
            <p>Total Sales</p>
        </div>

    </div>

    <div class="search-box">
        <input
        type="text"
        id="searchInput"
        placeholder="Search Order ID or Customer Name..."
        onkeyup="searchOrder()">
    </div>

    <div class="table-box">

        <table id="orderTable">

            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Amount</th>
                <th>Status</th>
                <th>View</th>
                <th>Print</th>
            </tr>

            <tr>
                <td>#ORD001</td>
                <td>Rahul Kumar</td>
                <td>₹1500</td>
                <td><span class="status completed">Completed</span></td>
                <td>
                    <button class="view-btn"
                    onclick="viewOrder('ORD001','Rahul Kumar','1500')">
                        View
                    </button>
                </td>
                <td>
                    <button class="print-btn"
                    onclick="printOrder('ORD001','Rahul Kumar','1500')">
                        Print
                    </button>
                </td>
            </tr>

            <tr>
                <td>#ORD002</td>
                <td>Priya Singh</td>
                <td>₹2500</td>
                <td><span class="status pending">Pending</span></td>
                <td>
                    <button class="view-btn"
                    onclick="viewOrder('ORD002','Priya Singh','2500')">
                        View
                    </button>
                </td>
                <td>
                    <button class="print-btn"
                    onclick="printOrder('ORD002','Priya Singh','2500')">
                        Print
                    </button>
                </td>
            </tr>

        </table>

    </div>

</div>

<script>

function searchOrder(){

let input =
document.getElementById("searchInput")
.value.toLowerCase();

let rows =
document.querySelectorAll("#orderTable tr");

rows.forEach((row,index)=>{

if(index===0) return;

let text =
row.innerText.toLowerCase();

row.style.display =
text.includes(input)
? ""
: "none";

});

}

function viewOrder(id,name,amount){

alert(
"Order ID: " + id +
"\nCustomer: " + name +
"\nAmount: ₹" + amount
);

}

function printOrder(id,name,amount){

let w = window.open("");

w.document.write(`
<h2>Order Invoice</h2>
<hr>
<p><b>Order ID:</b> ${id}</p>
<p><b>Customer:</b> ${name}</p>
<p><b>Amount:</b> ₹${amount}</p>
`);

w.print();

}
</script>

</body>
</html>

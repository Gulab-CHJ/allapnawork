<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor & Shop Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fc;
    min-height:100vh;
}

/* Header */

.header{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.header h1{
    font-size:28px;
}

.back-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.back-btn:hover{
    background:#dc2626;
}

/* Main */

.container{
    padding:35px;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h2{
    color:#0f172a;
    margin-bottom:10px;
}

.title p{
    color:#64748b;
}

/* Grid */

.doctor-actions{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

/* Buttons */

.action-btn{
    border:none;
    padding:22px;
    border-radius:15px;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.action-btn:hover{
    transform:translateY(-5px);
}

.add-btn{
    background:linear-gradient(135deg,#10b981,#059669);
}

.delete-btn{
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

.update-btn{
    background:linear-gradient(135deg,#3b82f6,#2563eb);
}

.list-btn{
    background:linear-gradient(135deg,#8b5cf6,#7c3aed);
}

.orders{
    background:linear-gradient(135deg,#06b6d4,#0891b2);
}

.report{
    background:linear-gradient(135deg,#f59e0b,#ea580c);
}

.customers{
    background:linear-gradient(135deg,#14b8a6,#0f766e);
}

/* Mobile */

@media(max-width:768px){

.header{
    flex-direction:column;
    gap:15px;
    text-align:center;
}

.container{
    padding:20px;
}

.action-btn{
    font-size:16px;
    padding:18px;
}

}

</style>
</head>
<body>

<!-- Header -->

<div class="header">

    <h1>🧑‍⚕️ Doctor & Shop Dashboard</h1>

    <button class="back-btn"
    onclick="window.location.href='/page/admin-dashboard.html'">
        ⬅ Back
    </button>

</div>

<!-- Main -->

<div class="container">

    <div class="title">
        <h2>Management System</h2>
        <p>Select an option below</p>
    </div>

    <div class="doctor-actions">

        <!-- Doctor Section -->

        <button class="action-btn add-btn"
        onclick="window.location.href='/page/doctor-signup.html'">
            ➕ Add Doctor
        </button>

        <button class="action-btn delete-btn"
        onclick="window.location.href='/page/delete-doctor.html'">
            🗑 Delete Doctor
        </button>

        <button class="action-btn update-btn"
        onclick="window.location.href='/page/update-doctor.html'">
            ✏ Update Doctor
        </button>

        <button class="action-btn list-btn"
        onclick="window.location.href='/page/all-doctors.html'">
            📋 All Doctor List
        </button>

        <!-- Product Section -->

        <button class="action-btn add-btn"
        onclick="window.location.href='/page/add-product.html'">
            ➕ Add Product
        </button>

        <button class="action-btn update-btn"
        onclick="window.location.href='/page/update-product.html'">
            ✏ Update Product
        </button>

        <button class="action-btn delete-btn"
        onclick="window.location.href='/page/delete-product.html'">
            🗑 Delete Product
        </button>

        <button class="action-btn list-btn"
        onclick="window.location.href='/page/all-products.html'">
            📦 All Products
        </button>

        <!-- Orders -->

        <button class="action-btn orders"
        onclick="window.location.href='/page/orders.html'">
            🛒 Orders
        </button>

        <!-- Customers -->

        <button class="action-btn customers"
        onclick="window.location.href='/page/customers.html'">
            👥 Customers
        </button>

        <!-- Sales Report -->

        <button class="action-btn report"
        onclick="window.location.href='/page/sales-report.html'">
            📊 Sales Report
        </button>

    </div>

</div>

</body>
</html>

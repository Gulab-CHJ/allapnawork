<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Students</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fc;
    padding:30px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:#0f172a;
}

.top-bar{
    max-width:1000px;
    margin:auto;
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-box{
    flex:1;
}

.search-box input{
    width:100%;
    padding:14px 20px;
    border:none;
    border-radius:50px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    outline:none;
}

.excel-btn{
    border:none;
    background:#16a34a;
    color:white;
    padding:14px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.table-container{
    max-width:1000px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2563eb;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #eee;
}

.view-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.print-btn{
    background:#f59e0b;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.view-btn:hover{
    background:#1d4ed8;
}

.print-btn:hover{
    background:#d97706;
}
</style>
</head>
<body>

<div class="header">
    <h1>📋 All Student List</h1>
</div>

<div class="top-bar">

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search Student..."
            onkeyup="searchStudent()">
    </div>

    <button class="excel-btn" onclick="exportExcel()">
        📊 Export Excel
    </button>

</div>

<div class="table-container">

<table id="studentTable">

    <tr>
        <th>Name</th>
        <th>Class</th>
        <th>Phone</th>
        <th>View</th>
        <th>Print</th>
    </tr>

    <tr>
        <td>Rahul Kumar</td>
        <td>10</td>
        <td>9876543210</td>

        <td>
            <button class="view-btn"
            onclick="viewStudent('Rahul Kumar','Ramesh Kumar','17','9876543210','Patna','10')">
                View
            </button>
        </td>

        <td>
            <button class="print-btn"
            onclick="printStudent('Rahul Kumar','Ramesh Kumar','17','9876543210','Patna','10')">
                Print
            </button>
        </td>
    </tr>

    <tr>
        <td>Priya Singh</td>
        <td>9</td>
        <td>9876543211</td>

        <td>
            <button class="view-btn"
            onclick="viewStudent('Priya Singh','Raj Singh','16','9876543211','Delhi','9')">
                View
            </button>
        </td>

        <td>
            <button class="print-btn"
            onclick="printStudent('Priya Singh','Raj Singh','16','9876543211','Delhi','9')">
                Print
            </button>
        </td>
    </tr>

</table>

</div>

<script>

function searchStudent() {

    let input =
    document.getElementById("searchInput")
    .value.toLowerCase();

    let rows =
    document.querySelectorAll("#studentTable tr");

    rows.forEach((row,index)=>{

        if(index===0) return;

        let text =
        row.innerText.toLowerCase();

        row.style.display =
        text.includes(input)
        ? ""
        : "none";

    });

}

function viewStudent(
    name,
    father,
    age,
    phone,
    address,
    studentClass
){

alert(
`Student Name : ${name}

Father Name : ${father}

Age : ${age}

Phone : ${phone}

Address : ${address}

Class : ${studentClass}`
);

}

function printStudent(
    name,
    father,
    age,
    phone,
    address,
    studentClass
){

let printWindow =
window.open("","","width=800,height=600");

printWindow.document.write(`

<html>

<head>

<title>Student Details</title>

<style>

body{
font-family:Arial;
padding:30px;
}

h2{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
}

td{
border:1px solid #000;
padding:10px;
}

</style>

</head>

<body>

<h2>Student Details</h2>

<table>

<tr>
<td><b>Name</b></td>
<td>${name}</td>
</tr>

<tr>
<td><b>Father Name</b></td>
<td>${father}</td>
</tr>

<tr>
<td><b>Age</b></td>
<td>${age}</td>
</tr>

<tr>
<td><b>Phone</b></td>
<td>${phone}</td>
</tr>

<tr>
<td><b>Address</b></td>
<td>${address}</td>
</tr>

<tr>
<td><b>Class</b></td>
<td>${studentClass}</td>
</tr>

</table>

</body>

</html>

`);

printWindow.document.close();
printWindow.print();

}

function exportExcel(){

alert(
"Frontend Demo. Real Excel Export ke liye Node.js + MongoDB + XLSX package use hoga."
);

}

</script>

</body>
</html>
